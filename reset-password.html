<head>

<title>Reset password · SecondChance Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" data-sc="arfonts">

<style>
  .au { min-height:100vh; display:grid; }
  @media (min-width:900px) { .au { grid-template-columns: 1fr 1fr; } }
  .au-side { display:none; background:var(--color-ink); color:#fff; padding:48px 44px;
    flex-direction:column; justify-content:space-between; }
  @media (min-width:900px) { .au-side { display:flex; } }
  .au-mark { font-family:var(--font-bricolage); font-size:16px; font-weight:600;
    letter-spacing:-.01em; color:#fff; text-decoration:none; }
  .au-mark i { font-style:normal; color:#d98b8b; }
  .au-pitch { font-family:var(--font-bricolage); font-size:clamp(26px,3vw,38px);
    font-weight:600; line-height:1.22; letter-spacing:-.02em; max-width:15ch; }
  .au-note { font-size:13.5px; color:rgba(255,255,255,.62); line-height:1.7; max-width:34ch; }
  .au-main { display:grid; place-items:center; padding:34px 22px 54px; }
  .au-box { width:100%; max-width:392px; }
  .au-top { margin-bottom:26px; }
  .au-top a { font-family:var(--font-bricolage); font-size:15px; font-weight:600;
    color:var(--color-ink); text-decoration:none; }
  .au-top a i { font-style:normal; color:var(--color-accent); }
  @media (min-width:900px) { .au-top { display:none; } }
  .au-alt { margin-top:22px; font-size:13.5px; color:var(--color-muted); text-align:center; }
  .au-alt a { color:var(--color-accent); font-weight:500; }
  .au-otp { display:flex; gap:9px; justify-content:space-between; }
  .au-otp input { width:100%; aspect-ratio:1/1.15; text-align:center; font-size:21px;
    font-weight:600; font-variant-numeric:tabular-nums; border:1px solid var(--color-line);
    border-radius:13px; background:var(--color-canvas); color:var(--color-ink);
    transition:border-color .16s, box-shadow .16s; }
  .au-otp input:focus { outline:none; border-color:var(--color-accent);
    box-shadow:0 0 0 3px var(--color-accent-tint); }
  .au-or { display:flex; align-items:center; gap:12px; margin:4px 0; }
  .au-or::before, .au-or::after { content:''; flex:1; height:1px;
    background:var(--color-line); }
  .au-or span { font-size:12px; color:var(--color-muted); }
</style>
</head>
<body class="sc">
<div class="au">
  <aside class="au-side">
    <a class="au-mark" href="index.html">SecondChance collective<i>.</i></a>
    <div>
      <p class="au-pitch">Your email is your account.</p>
      <p class="au-note" style="margin-top:18px">Which means there is no reset link sitting in an inbox waiting to be found.</p>
    </div>
    <p class="au-note">Amman, Jordan</p>
  </aside>

  <main class="au-main">
    <div class="au-box">
      <div class="au-top"><a href="index.html">SecondChance collective<i>.</i></a></div>
      <h1 class="sc-h1" style="font-size:27px">No reset link here</h1>
      <p class="sc-lead" style="margin-top:7px">Get a code, sign in, then set a new password in your settings.</p>
      <form id="reset-form" style="margin-top:24px"></form>
      
    </div>
  </main>
</div>
<script type="module">
