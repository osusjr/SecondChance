<!DOCTYPE html>

<head><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link data-sc="arfonts" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

<title>Listing · SecondChance Collective</title>

<style>
  .it-head { border-bottom: 1px solid var(--color-line); background: var(--color-canvas); }
  .it-bar { display: flex; align-items: center; gap: 14px; padding: 16px 0; }
  .it-brand { font-family: var(--font-bricolage); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .it-brand i { font-style: normal; color: var(--color-accent); }
  .it-wrap { padding: 26px 0 70px; }
  .it-grid { display: grid; gap: 30px; align-items: start; }
  @media (min-width: 900px) { .it-grid { grid-template-columns: 1.15fr .85fr; gap: 44px; } }
  .it-gallery { display: grid; gap: 10px; }
  .it-main-img { width: 100%; aspect-ratio: 4/5; object-fit: cover;
    border-radius: var(--radius-card); background: var(--color-product); }
  .it-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .it-thumbs button { padding: 0; border: 2px solid transparent; background: none;
    border-radius: 12px; overflow: hidden; cursor: pointer; }
  .it-thumbs button.is-active { border-color: var(--color-accent); }
  .it-thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    background: var(--color-product); }
  .it-side { position: sticky; top: 24px; }
  .it-price { font-family: var(--font-bricolage); font-size: 30px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .it-retail { color: var(--color-muted); text-decoration: line-through; font-size: 14px; margin-left: 8px; }
</style>
<link href="sc-rtl.css" rel="stylesheet"/></head>

</nav>
