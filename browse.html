<!DOCTYPE html>

<html class="bricolage_grotesque_e01f6fad-module__frOMPG__variable poppins_ead9b0ae-module__Bvcf9q__variable" lang="en-JO">
<head><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link data-sc="arfonts" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#ffffff" name="theme-color"/>
<title>Shop all · SecondChance Collective</title>
<link href="styles.css" rel="stylesheet"/>
<link href="sc-app.css" rel="stylesheet"/>
<style>
  .br-head { border-bottom: 1px solid var(--color-line); background: var(--color-canvas); }
  .br-bar { display: flex; align-items: center; gap: 14px; padding: 16px 0; }
  .br-brand { font-family: var(--font-bricolage); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .br-brand i { font-style: normal; color: var(--color-accent); }
  .br-wrap { padding: 26px 0 70px; }
  .br-layout { display: grid; gap: 28px; align-items: start; }
  @media (min-width: 940px) { .br-layout { grid-template-columns: 232px 1fr; gap: 38px; } }
  .br-filters { display: grid; gap: 20px; }
  @media (min-width: 940px) { .br-filters { position: sticky; top: 22px; } }
  .br-group > p { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--color-muted); font-weight: 500; margin-bottom: 9px; }
  .br-opts { display: grid; gap: 5px; max-height: 210px; overflow-y: auto; }
  .br-opts label { display: flex; align-items: center; gap: 8px; font-size: 13.5px;
    color: var(--color-ink); cursor: pointer; padding: 2px 0; }
  .br-opts input { accent-color: var(--color-accent); }
  .br-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 700px) { .br-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1180px) { .br-grid { grid-template-columns: repeat(4, 1fr); } }
  .br-card { display: block; color: inherit; text-decoration: none; }
  .br-card img, .br-ph { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block;
    border-radius: var(--radius-inner); background: var(--color-product); }
  .br-card:hover img { opacity: .9; }
  .br-tag { position: absolute; top: 9px; left: 9px; }
</style>
<link href="sc-rtl.css" rel="stylesheet"/></head>
<body class="sc">
<header class="br-head">
<div class="sc-shell br-bar">
<a class="br-brand" href="index.html">SecondChance collective<i>.</i></a>
<nav class="sc-row-tight sc-right" style="gap:4px">
<a class="sc-btn sc-btn-ghost sc-btn-sm" href="browse.html">Shop</a>
<a class="sc-btn sc-btn-ghost sc-btn-sm" href="account.html">Account</a>
<a class="sc-btn sc-btn-primary sc-btn-sm" href="sell.html">List an item</a>
</nav>
</div>
</header>
<main class="sc-shell br-wrap">
<h1 class="sc-h1">Shop all</h1>
<p class="sc-lead" style="margin-top:6px">Every piece, checked and ready to go.</p>
<div class="br-layout" style="margin-top:26px">
<aside class="br-filters" id="br-filters">
<div class="sc-skeleton" style="height:280px"></div>
</aside>
<div>
<div class="sc-between" style="margin-bottom:16px;gap:12px;flex-wrap:wrap">
<p class="sc-sm sc-muted" id="br-count">Loading…</p>
<select class="sc-select" id="br-sort" style="width:auto;min-width:190px">
<option value="new">Newest first</option>
<option value="price_asc">Price: low to high</option>
<option value="price_desc">Price: high to low</option>
<option value="popular">Most viewed</option>
</select>
</div>
<div class="br-grid" id="br-grid"></div>
<div style="text-align:center;margin-top:30px">
<button class="sc-btn sc-btn-ghost" hidden="" id="br-more">Show more</button>
</div>
</div>
</div>
</main>
<script type="module">
  import { initBrowse } from './js/sc-browse.js';
  initBrowse();
</script>
<script data-sc="i18n" type="module">import { initI18n } from './js/sc-i18n.js'; initI18n();</script></body>
</html>
